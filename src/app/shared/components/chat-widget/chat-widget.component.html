<button
  (click)="toggle()"
  class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-green-500 hover:bg-green-600 text-white shadow-lg flex items-center justify-center transition">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
  </svg>
</button>

<div *ngIf="open" class="fixed bottom-24 right-6 z-50 w-80 max-h-[28rem] bg-white rounded-2xl shadow-xl border border-gray-100 flex flex-col overflow-hidden">
  <div class="bg-green-500 text-white px-4 py-3 font-semibold text-sm">Asistente EcoMovil</div>

  <div class="flex-1 overflow-y-auto p-3 space-y-3 text-sm">
    <p *ngIf="turns.length === 0" class="text-gray-400 text-xs">Pregúntame qué vehículo te conviene o busca uno cerca de ti.</p>

    <div *ngFor="let t of turns" [class]="t.from === 'user' ? 'text-right' : 'text-left'">
      <p [class]="t.from === 'user'
          ? 'inline-block bg-green-500 text-white rounded-xl px-3 py-2'
          : 'inline-block bg-gray-100 text-gray-700 rounded-xl px-3 py-2'">
        {{ t.text }}
      </p>

      <div *ngIf="t.suggestions?.length" class="mt-2 space-y-1.5">
        <a *ngFor="let s of t.suggestions" [routerLink]="['/vehicleDetailsAcquirer', s.id]"
          class="block bg-white border border-gray-200 rounded-xl px-3 py-2 hover:border-green-400 transition">
          <p class="font-semibold text-gray-800 text-xs">{{ s.name }}</p>
          <p class="text-gray-400 text-xs">S/ {{ s.priceSell }} venta · S/ {{ s.priceRent }}/día
            <span *ngIf="s.distanceKm !== null"> · {{ s.distanceKm.toFixed(1) }} km</span>
          </p>
        </a>
      </div>
    </div>

    <p *ngIf="sending" class="text-gray-400 text-xs">Escribiendo...</p>
  </div>

  <div class="border-t border-gray-100 p-2 flex gap-2">
    <input [(ngModel)]="input" (keyup.enter)="send()" placeholder="Escribe tu mensaje..."
      class="flex-1 px-3 py-2 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-400" />
    <button (click)="send()" [disabled]="sending"
      class="px-3 py-2 rounded-xl bg-green-500 hover:bg-green-600 text-white text-sm font-semibold disabled:opacity-50">
      Enviar
    </button>
  </div>
</div>
