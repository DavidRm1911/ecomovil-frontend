<!-- Botón flotante -->
<button
  (click)="toggle()"
  class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-green-500 hover:bg-green-600 text-white shadow-lg flex items-center justify-center transition">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
  </svg>
</button>

<!-- Panel de chat -->
<div *ngIf="open" class="fixed bottom-24 right-6 z-50 w-80 max-h-[32rem] bg-white rounded-2xl shadow-xl border border-gray-100 flex flex-col overflow-hidden">

  <!-- Header -->
  <div class="bg-green-500 text-white px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 rounded-full bg-green-200 animate-pulse"></div>
      <span class="font-semibold text-sm">Asistente EcoMovil</span>
    </div>
    <button *ngIf="turns.length > 0" (click)="reset()"
      title="Nueva conversación"
      class="flex items-center gap-1 text-xs text-green-100 hover:text-white bg-green-600 hover:bg-green-700 px-2 py-1 rounded-lg transition">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Nueva conversación
    </button>
  </div>

  <!-- Mensajes -->
  <div class="flex-1 overflow-y-auto p-3 space-y-3 text-sm">
    <p *ngIf="turns.length === 0" class="text-gray-400 text-xs text-center pt-2">
      Pregúntame qué vehículo te conviene o busca uno cerca de ti.
    </p>

    <div *ngFor="let t of turns" [class]="t.from === 'user' ? 'text-right' : 'text-left'">
      <!-- Burbuja de texto -->
      <p [class]="t.from === 'user'
          ? 'inline-block bg-green-500 text-white rounded-2xl rounded-tr-sm px-3 py-2 text-sm'
          : 'inline-block bg-gray-100 text-gray-700 rounded-2xl rounded-tl-sm px-3 py-2 text-sm'">
        {{ t.text }}
      </p>

      <!-- Cards de sugerencias -->
      <div *ngIf="t.suggestions?.length" class="mt-2 space-y-2">
        <a *ngFor="let s of t.suggestions"
           [routerLink]="['/vehicleDetailsAcquirer', s.id]"
           class="flex gap-3 bg-white border border-gray-200 rounded-xl p-2.5 hover:border-green-400 hover:shadow-sm transition group">

          <!-- Imagen del vehículo -->
          <img [src]="getImage(s.imageUrl)"
               [alt]="s.name"
               class="w-16 h-16 object-cover rounded-lg shrink-0 bg-gray-50" />

          <!-- Info + botón -->
          <div class="flex flex-col justify-between flex-1 min-w-0">
            <div>
              <p class="font-semibold text-gray-800 text-xs truncate">{{ s.name }}</p>
              <p class="text-gray-400 text-xs capitalize">{{ s.type }}</p>
              <p class="text-green-600 text-xs font-medium mt-0.5">S/ {{ s.priceSell }} venta</p>
              <p class="text-gray-400 text-xs">S/ {{ s.priceRent }}/día
                <span *ngIf="s.distanceKm !== null"> · {{ s.distanceKm.toFixed(1) }} km</span>
              </p>
            </div>

            <!-- Botón ver detalle -->
            <span class="mt-1 inline-flex items-center gap-1 text-xs text-green-600 font-semibold group-hover:text-green-700">
              Ver vehículo
              <svg class="w-3 h-3 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
              </svg>
            </span>
          </div>
        </a>
      </div>
    </div>

    <p *ngIf="sending" class="text-gray-400 text-xs flex items-center gap-1">
      <span class="inline-block w-1.5 h-1.5 bg-gray-300 rounded-full animate-bounce"></span>
      <span class="inline-block w-1.5 h-1.5 bg-gray-300 rounded-full animate-bounce [animation-delay:0.15s]"></span>
      <span class="inline-block w-1.5 h-1.5 bg-gray-300 rounded-full animate-bounce [animation-delay:0.3s]"></span>
    </p>
  </div>

  <!-- Input -->
  <div class="border-t border-gray-100 p-2 flex gap-2">
    <input [(ngModel)]="input" (keyup.enter)="send()" placeholder="Escribe tu mensaje..."
      class="flex-1 px-3 py-2 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-400" />
    <button (click)="send()" [disabled]="sending"
      class="px-3 py-2 rounded-xl bg-green-500 hover:bg-green-600 text-white text-sm font-semibold disabled:opacity-50 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
      </svg>
    </button>
  </div>
</div>
