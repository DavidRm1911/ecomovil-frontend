<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-green-100 rounded-2xl mb-4">
          <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Bienvenido</h1>
        <p class="text-gray-500 text-sm mt-1">Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Toggle login/register -->
      <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
        <button type="button"
          class="flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow text-green-600 font-semibold">
          Iniciar sesión
        </button>
        <button type="button"
          class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition"
          routerLink="/registerUniversity">
          Registrarse
        </button>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>

        <!-- Usuario -->
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
          <input
            type="text"
            name="username"
            placeholder="Tu nombre de usuario"
            [(ngModel)]="form.username"
            #username="ngModel"
            required
            class="w-full px-4 py-3 rounded-xl border bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition text-sm placeholder-gray-400"
            [class.border-red-300]="username.invalid && username.touched"
            [class.focus:ring-red-400]="username.invalid && username.touched"
            [class.border-gray-200]="!(username.invalid && username.touched)"
            [class.focus:ring-green-400]="!(username.invalid && username.touched)"
          />
          <p *ngIf="username.invalid && username.touched" class="text-red-500 text-xs mt-1 flex items-center gap-1">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            El usuario es obligatorio
          </p>
        </div>

        <!-- Contraseña -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
          <input
            type="password"
            name="password"
            placeholder="Tu contraseña"
            [(ngModel)]="form.password"
            #password="ngModel"
            required
            class="w-full px-4 py-3 rounded-xl border bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition text-sm placeholder-gray-400"
            [class.border-red-300]="password.invalid && password.touched"
            [class.focus:ring-red-400]="password.invalid && password.touched"
            [class.border-gray-200]="!(password.invalid && password.touched)"
            [class.focus:ring-green-400]="!(password.invalid && password.touched)"
          />
          <p *ngIf="password.invalid && password.touched" class="text-red-500 text-xs mt-1 flex items-center gap-1">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            La contraseña es obligatoria
          </p>
        </div>

        <!-- Error general -->
        <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          {{ errorMessage }}
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || loading"
          class="w-full py-3 rounded-xl font-semibold text-white transition-all duration-200
            bg-green-500 hover:bg-green-600 active:scale-95
            disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-green-500"
        >
          <span *ngIf="!loading">Iniciar sesión</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Ingresando...
          </span>
        </button>

      </form>
    </div>

  </div>
</div>
