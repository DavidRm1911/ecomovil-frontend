<app-header></app-header>

<section class="min-h-screen bg-gray-50">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">

    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-customGreen">Control y protección del activo</h1>
      <p class="text-gray-500 text-sm mt-1" *ngIf="vehicle">{{ vehicle.name }}</p>
    </div>

    <div *ngIf="!vehicle" class="text-center py-24 text-gray-400">Cargando estado del vehículo…</div>

    <!-- Banner de transgresión de geocerca -->
    <div *ngIf="vehicle?.geofenceBreached"
      class="mb-6 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 flex items-center gap-3">
      <span class="text-xl">🚨</span>
      <div>
        <p class="font-semibold text-sm">El vehículo salió del área permitida</p>
        <p class="text-xs opacity-80" *ngIf="vehicle?.lastIotUpdate">
          Última actualización: {{ vehicle!.lastIotUpdate | date:'dd/MM/yy HH:mm:ss' }}
        </p>
      </div>
    </div>

    <div *ngIf="vehicle" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="flex flex-col gap-6">
        <app-lock-toggle [vehicle]="vehicle" (changed)="onVehicleLockChanged($event)"></app-lock-toggle>
        <app-incident-feed [alerts]="alerts" title="Alertas de este vehículo"></app-incident-feed>
      </div>

      <app-geofence-editor [vehicle]="vehicle" (saved)="onGeofenceSaved($event)"></app-geofence-editor>
    </div>
  </div>
</section>
