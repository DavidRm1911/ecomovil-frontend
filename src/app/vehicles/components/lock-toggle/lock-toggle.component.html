<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-center justify-between gap-4">
  <div>
    <p class="font-bold text-gray-800">Bloqueo remoto del motor</p>
    <p class="text-xs text-gray-400 mt-0.5">
      Corta o permite la energía del motor mediante el relé de 5V del vehículo
    </p>
    <p *ngIf="error" class="text-xs text-red-600 mt-1">{{ error }}</p>
  </div>

  <button
    type="button"
    role="switch"
    [attr.aria-checked]="vehicle.isLocked"
    (click)="toggle()"
    [disabled]="loading || !vehicle.iotDeviceId"
    class="relative inline-flex h-8 w-16 shrink-0 items-center rounded-full transition-colors duration-200 disabled:opacity-50"
    [class.bg-red-500]="vehicle.isLocked"
    [class.bg-green-500]="!vehicle.isLocked">
    <span
      class="inline-block h-6 w-6 transform rounded-full bg-white shadow transition-transform duration-200"
      [class.translate-x-9]="vehicle.isLocked"
      [class.translate-x-1]="!vehicle.isLocked">
    </span>
  </button>
</div>

<p class="text-center text-sm font-semibold mt-2" [class.text-red-600]="vehicle.isLocked" [class.text-green-600]="!vehicle.isLocked">
  {{ loading ? 'Enviando comando…' : (vehicle.isLocked ? '🔒 Bloqueado' : '🔓 Desbloqueado') }}
</p>

<p *ngIf="!vehicle.iotDeviceId" class="text-center text-xs text-gray-400 mt-1">
  Vincula un dispositivo IoT a este vehículo para habilitar el bloqueo remoto.
</p>
