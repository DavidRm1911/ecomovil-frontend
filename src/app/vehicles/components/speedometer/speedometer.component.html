<div class="flex flex-col items-center select-none">
  <svg viewBox="0 0 200 120" class="w-48 h-32">
    <!-- Track -->
    <path d="M10,110 A90,90 0 0 1 190,110" fill="none" stroke="#e5e7eb" stroke-width="14" stroke-linecap="round"/>
    <!-- Overspeed zone (last 30% of arc) -->
    <path d="M146,26 A90,90 0 0 1 190,110" fill="none" stroke="#fca5a5" stroke-width="14" stroke-linecap="round"/>
    <!-- Progress -->
    <path [attr.d]="'M10,110 A90,90 0 0 1 190,110'"
          fill="none"
          [attr.stroke]="isOverspeed ? '#dc2626' : '#1ACD81'"
          stroke-width="14"
          stroke-linecap="round"
          [attr.stroke-dasharray]="(clamped / maxSpeed) * 282.7 + ' 282.7'"/>
    <!-- Needle -->
    <g [attr.transform]="'rotate(' + needleRotation + ' 100 110)'">
      <line x1="100" y1="110" x2="100" y2="35" [attr.stroke]="isOverspeed ? '#dc2626' : '#374151'" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="100" cy="110" r="6" [attr.fill]="isOverspeed ? '#dc2626' : '#374151'"/>
  </svg>

  <p class="text-3xl font-bold -mt-2" [class.text-red-600]="isOverspeed" [class.text-gray-800]="!isOverspeed">
    {{ (speedKmh ?? 0) | number:'1.0-0' }}
  </p>
  <p class="text-xs text-gray-400 tracking-wide uppercase">km/h</p>

  <p *ngIf="isOverspeed" class="mt-1 text-xs font-semibold text-red-600 flex items-center gap-1">
    ⚡ Exceso de velocidad
  </p>
</div>
