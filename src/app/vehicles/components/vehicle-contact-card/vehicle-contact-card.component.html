<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md hover:-translate-y-0.5 transition-all duration-200">

  <div class="relative h-40 bg-gray-100 overflow-hidden cursor-pointer"
    [routerLink]="['/vehicleDetailsAcquirer', vehicle.id]">
    <img
      [src]="vehicle.imageUrl || 'assets/vehicle-placeholder.svg'"
      [alt]="vehicle.name"
      class="w-full h-full object-cover"
      onerror="this.onerror=null;this.src='assets/vehicle-placeholder.svg'" />
    <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-green-700 text-xs font-semibold px-2.5 py-1 rounded-lg">
      {{ vehicle.type }}
    </span>
    <span *ngIf="vehicle.iotDeviceId" class="absolute top-3 right-3 bg-customGreen text-white text-xs font-semibold px-2.5 py-1 rounded-lg">
      📡 GPS
    </span>
  </div>

  <div class="p-4">
    <h3 class="font-bold text-gray-800 text-base leading-tight">{{ vehicle.name }}</h3>
    <p *ngIf="ownerName" class="text-xs text-gray-400 mt-0.5">Proveedor: {{ ownerName }}</p>
    <p class="text-gray-500 text-xs line-clamp-2 my-2">{{ vehicle.description }}</p>

    <div class="flex items-center gap-3 py-2 border-t border-gray-100 mb-3">
      <div class="flex-1 text-center">
        <p class="text-xs text-gray-400 mb-0.5">Renta / día</p>
        <p class="font-bold text-green-600 text-sm">S/ {{ vehicle.priceRent }}</p>
      </div>
      <div class="w-px h-8 bg-gray-100"></div>
      <div class="flex-1 text-center">
        <p class="text-xs text-gray-400 mb-0.5">Venta</p>
        <p class="font-bold text-green-600 text-sm">S/ {{ vehicle.priceSell }}</p>
      </div>
    </div>

    <button
      (click)="openWhatsApp($event)"
      class="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#1ebc59] text-white font-semibold text-sm py-2.5 rounded-xl transition-all duration-200 active:scale-95">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12.004 2.003c-5.522 0-9.997 4.475-9.997 9.997 0 1.762.463 3.484 1.34 4.997L2 22l5.116-1.341a9.958 9.958 0 004.888 1.243h.004c5.522 0 9.997-4.476 9.997-9.998 0-2.67-1.04-5.18-2.929-7.069a9.935 9.935 0 00-7.072-2.832zm5.876 15.782a8.256 8.256 0 01-4.885 1.548h-.003a8.264 8.264 0 01-4.213-1.155l-.302-.18-3.037.796.811-2.96-.198-.312a8.22 8.22 0 01-1.262-4.42c0-4.55 3.703-8.253 8.256-8.253a8.2 8.2 0 015.847 2.418 8.19 8.19 0 012.416 5.847c0 4.552-3.703 8.255-8.43 8.271z"/>
      </svg>
      Contactar por WhatsApp
    </button>
  </div>
</div>
