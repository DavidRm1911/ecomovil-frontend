<app-header></app-header>

<section class="min-h-screen bg-gray-50 py-10 px-4">
  <div class="max-w-2xl mx-auto">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

      <!-- Header card -->
      <div class="bg-gradient-to-r from-green-600 to-green-500 px-8 py-8">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white">{{ 'my_profile' | translate }}</h1>
            <p class="text-green-100 text-sm">{{ 'personal_information' | translate }}</p>
          </div>
        </div>
      </div>

      <!-- Info -->
      <div class="p-8 space-y-4">

        <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl">
          <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <div>
            <p class="text-xs text-gray-400">Nombre</p>
            <p class="font-semibold text-gray-800">{{ getFirstName(user.fullName) || '—' }}</p>
          </div>
        </div>

        <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl">
          <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <div>
            <p class="text-xs text-gray-400">Email</p>
            <p class="font-semibold text-gray-800">{{ user.email || '—' }}</p>
          </div>
        </div>

        <div *ngIf="user.phoneNumber && user.phoneNumber !== '000000000'"
          class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl">
          <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
          </div>
          <div>
            <p class="text-xs text-gray-400">Teléfono</p>
            <p class="font-semibold text-gray-800">{{ user.phoneNumber }}</p>
          </div>
        </div>

        <div *ngIf="user.ruc && user.ruc !== '00000000000'"
          class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl">
          <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          </div>
          <div>
            <p class="text-xs text-gray-400">RUC</p>
            <p class="font-semibold text-gray-800">{{ user.ruc }}</p>
          </div>
        </div>

      </div>

      <!-- Action -->
      <div class="px-8 pb-8">
        <a routerLink="/sellereditProfile"
          class="block w-full py-3 text-center rounded-xl font-semibold text-white bg-green-500 hover:bg-green-600 active:scale-95 transition-all duration-200">
          {{ 'edit_profile' | translate }}
        </a>
      </div>

    </div>
  </div>
</section>
