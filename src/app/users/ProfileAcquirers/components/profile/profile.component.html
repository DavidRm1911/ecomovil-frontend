<form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-4">

  <div>
    <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Nombre completo</label>
    <input
      id="name"
      formControlName="name"
      placeholder="Ej. Juan Pérez"
      class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition text-sm placeholder-gray-400"
    />
    <p *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched"
      class="text-red-500 text-xs mt-1">El nombre es obligatorio</p>
  </div>

  <div>
    <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
    <input
      id="email"
      formControlName="email"
      placeholder="correo@ejemplo.com"
      class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition text-sm placeholder-gray-400"
    />
    <p *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched"
      class="text-red-500 text-xs mt-1">Email inválido</p>
  </div>

  <div>
    <label for="phone" class="block text-sm font-semibold text-gray-700 mb-1">
      Teléfono <span class="text-gray-400 font-normal">(9 dígitos)</span>
    </label>
    <input
      id="phone"
      formControlName="phone"
      placeholder="987654321"
      maxlength="9"
      class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition text-sm placeholder-gray-400"
    />
    <p *ngIf="profileForm.get('phone')?.invalid && profileForm.get('phone')?.touched"
      class="text-red-500 text-xs mt-1">Teléfono obligatorio</p>
  </div>

  <div>
    <label for="ruc" class="block text-sm font-semibold text-gray-700 mb-1">
      RUC <span class="text-gray-400 font-normal">(11 dígitos)</span>
    </label>
    <input
      id="ruc"
      formControlName="ruc"
      placeholder="12345678901"
      maxlength="11"
      class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition text-sm placeholder-gray-400"
    />
    <p *ngIf="profileForm.get('ruc')?.invalid && profileForm.get('ruc')?.touched"
      class="text-red-500 text-xs mt-1">RUC obligatorio</p>
  </div>

  <button
    type="submit"
    [disabled]="profileForm.invalid"
    class="w-full py-3 rounded-xl font-semibold text-white transition-all duration-200 active:scale-95
      bg-green-500 hover:bg-green-600
      disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-green-500">
    Guardar cambios
  </button>

</form>
